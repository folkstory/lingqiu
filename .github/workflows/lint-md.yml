name: lint-md

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set node version
        uses: actions/setup-node@v7

      - name: Install dependencies
        run: npm install

      - name: Lint markdown
        run: |
          npm run lint-md
          # npm run zhlint
          npm run zhlint:fix
